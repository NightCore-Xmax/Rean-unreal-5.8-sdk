[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=REAN SDK Sample
Description=Sign in with REAN, friends, presence and invites.

[/Script/ReanSDK.ReanSettings]
; Put YOUR app's client id here (Project Settings > Plugins > REAN SDK), or pass
; -ReanClientId=rean_... on the command line in development builds.
; This placeholder makes sign-in fail with "invalid client" on purpose.
ClientId=rean_xxxxxxxxxxxxxxxxxxxxxxxx
Scopes=openid profile offline_access friends.read presence.read presence.write invites
bSaveSession=True
EventPollSeconds=10
